[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marsos-desktop"
version = "1.0.0"
description = "marsOS desktop applications: store, installer, settings, and .bundle handler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "marsOS" }]
dependencies = [
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
marsos-store = "marsos.apps.store.main:main"
marsos-installer = "marsos.apps.installer.main:main"
marsos-bundle = "marsos.apps.bundle.main:main"
marsos-settings = "marsos.apps.settings.main:main"
marsos-launchpad = "marsos.apps.launchpad.main:main"
marsos-control-center = "marsos.apps.controlcenter.main:main"
marsos-updater = "marsos.apps.updater.main:main"
marsos-welcome = "marsos.apps.welcome.main:main"
# added
marsos-spotlight = "marsos.apps.spotlight.main:main"
marsos-session-init = "marsos.apps.session.main:main"
marsos-helper = "marsos.core.helper:main"
marsos-install-backend = "marsos.core.installer_backend:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marsos = ["data/**/*", "ui/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
